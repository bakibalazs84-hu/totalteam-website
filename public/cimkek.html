<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<link rel="icon" href="/favicon.ico" sizes="any"><link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png"><link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Raktár Címkék</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Inter:wght@400;500;600;700&display=swap">
<style>
/* Nyomtatható raktári címkék QR-kóddal. Képernyőn: beállítások + előnézet; nyomtatáskor csak az ívek. */
:root {
  --bg: #f6f6f3; --surface: #ffffff; --border: #e3e2dc; --fg: #1b1a17; --fg-muted: #7d7b73; --accent: #a8823f; --on-accent: #fff; --pill-bg: #edece7;
  --font-display: 'Playfair Display', Georgia, serif; --font-body: 'Inter', system-ui, -apple-system, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) { --bg: #141412; --surface: #1d1c1a; --border: #2f2e2a; --fg: #f0efea; --fg-muted: #94928a; --accent: #cfa968; --on-accent: #141412; --pill-bg: #292824; color-scheme: dark; }
}
:root[data-theme="dark"] { --bg: #141412; --surface: #1d1c1a; --border: #2f2e2a; --fg: #f0efea; --fg-muted: #94928a; --accent: #cfa968; --on-accent: #141412; --pill-bg: #292824; color-scheme: dark; }
* { box-sizing: border-box; margin: 0; padding: 0; }
[hidden] { display: none !important; }
body { background: var(--bg); color: var(--fg); font-family: var(--font-body); font-size: 14px; }
button, input, select, textarea { font: inherit; color: inherit; }

.controls { position: sticky; top: 0; z-index: 10; background: var(--surface); border-bottom: 1px solid var(--border); }
.controls-inner { max-width: 1200px; margin: 0 auto; padding: 12px 16px; display: flex; flex-wrap: wrap; gap: 12px 16px; align-items: flex-end; }
.logo { font-family: var(--font-display); font-size: 19px; font-weight: 700; width: 100%; display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
.logo span { color: var(--accent); }
.logo a { font-family: var(--font-body); font-size: 12px; font-weight: 500; color: var(--accent); }
label.f { display: flex; flex-direction: column; gap: 3px; font-size: 11px; color: var(--fg-muted); }
select, input[type=search], input[type=number], textarea { padding: 7px 9px; border: 1px solid var(--border); border-radius: 6px; background: var(--bg); font-size: 13px; }
textarea { width: 260px; height: 36px; resize: vertical; }
input[type=number] { width: 80px; }
.check { display: flex; align-items: center; gap: 6px; font-size: 13px; padding-bottom: 8px; }
.btn { height: 36px; padding: 0 18px; border-radius: 6px; border: 1px solid var(--accent); background: var(--accent); color: var(--on-accent); font-weight: 600; cursor: pointer; }
.info { font-size: 12px; color: var(--fg-muted); padding-bottom: 9px; font-variant-numeric: tabular-nums; }
.tip { max-width: 1200px; margin: 12px auto 0; padding: 0 16px; font-size: 12px; color: var(--fg-muted); }

.preview { padding: 20px 16px 60px; display: flex; flex-direction: column; align-items: center; gap: 20px; overflow-x: auto; }

/* ── Ívek és címkék (mm alapon, nyomtatáshoz) ── */
.sheet { background: #fff; color: #000; box-shadow: 0 2px 12px rgba(0,0,0,.15); display: grid; flex-shrink: 0; overflow: hidden; }
.label { overflow: hidden; display: flex; align-items: center; gap: 2.2mm; padding: 2.2mm 2.6mm; font-family: var(--font-body); color: #000; }
.label.blank { visibility: hidden; }
.qr { flex-shrink: 0; display: block; }
.ltext { min-width: 0; flex: 1; display: flex; flex-direction: column; justify-content: center; gap: .6mm; }
.lcode { font-weight: 700; letter-spacing: .02em; line-height: 1; white-space: nowrap; }
.lname { font-weight: 500; line-height: 1.15; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow-wrap: anywhere; }
.lmeta { color: #444; line-height: 1.1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.lbrand { font-family: var(--font-display); font-weight: 700; color: #000; }
.lbrand::after { content: '.'; color: #a8823f; }
.screen-guides .label { outline: .2mm dashed #ccc; outline-offset: -.1mm; }

@media print {
  body { background: #fff; }
  .controls, .tip { display: none !important; }
  .preview { padding: 0; gap: 0; display: block; }
  .sheet { box-shadow: none; break-after: page; page-break-after: always; }
  .sheet:last-child { break-after: auto; page-break-after: auto; }
  .screen-guides .label { outline: none; }
}
</style>
<style id="pageStyle"></style>
</head>
<body>
<div class="controls">
  <div class="controls-inner">
    <div class="logo"><div>Total Team<span>.</span> Raktár – címkék</div><a href="/admin.html">← Kivitelek</a></div>
    <label class="f">Címke formátum
      <select id="layout">
        <option value="a4-24">A4 ív – 24 db, 70×37 mm (3×8)</option>
        <option value="a4-40">A4 ív – 40 db, 52,5×29,7 mm (4×10)</option>
        <option value="ql-62x29">Brother QL – 62×29 mm (DK-11209)</option>
        <option value="ql-62x100">Brother QL – 62×100 mm (DK-11202) – nagy tárgyakra</option>
      </select>
    </label>
    <label class="f">Kategória<select id="cat"></select></label>
    <label class="f">Keresés<input type="search" id="q" placeholder="név, kód…"></label>
    <label class="f">Csak ezek a kódok (vesszővel)<textarea id="codes" placeholder="pl. LMP-012, ASZ-001"></textarea></label>
    <label class="check"><input type="checkbox" id="perPiece"> darabszám szerint (minden darabra egy)</label>
    <label class="f" id="skipWrap">Első üres címke az íven<input type="number" id="skip" min="1" value="1"></label>
    <span class="info" id="info"></span>
    <button class="btn" id="print" type="button">Nyomtatás / PDF</button>
  </div>
</div>
<p class="tip">Nyomtatásnál: méretezés <b>100% (tényleges méret)</b>, margók <b>nincs</b>, „fejléc és lábléc” kikapcsolva. Félig használt ívnél add meg, hányadik címkétől induljon. A QR-kód a tétel oldalára mutat, a kivitel felületen a beolvasás a kódot ismeri fel.</p>
<div class="preview screen-guides" id="preview"></div>

<script src="/vendor/qrcode.js"></script>
<script>
// A QR-kód a nyilvános raktár oldalon nyitja meg a tételt (raktar.html#KÓD)
const QR_BASE = 'https://totalteam.hu/raktar.html#';

const LAYOUTS = {
  'a4-24':    { page: [210, 297], cols: 3, rows: 8,  w: 70,   h: 37,    top: 0.5, left: 0, code: 4.6, name: 2.7, meta: 2.2, brand: 2.4 },
  'a4-40':    { page: [210, 297], cols: 4, rows: 10, w: 52.5, h: 29.7,  top: 0,   left: 0, code: 3.8, name: 2.3, meta: 1.9, brand: 0 },
  'ql-62x29': { page: [62, 29],   cols: 1, rows: 1,  w: 62,   h: 29,    top: 0,   left: 0, code: 4.4, name: 2.6, meta: 2.1, brand: 2.2 },
  'ql-62x100':{ page: [62, 100],  cols: 1, rows: 1,  w: 62,   h: 100,   top: 0,   left: 0, code: 8,   name: 4,   meta: 3,   brand: 3.5, vertical: true },
};
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const $ = id => document.getElementById(id);
let PRODUCTS = [];

// QR → SVG (1 egység = 1 modul, 2 modul csendes zóna – a címkén belül marad hely)
const qrCache = new Map();
function qrSvg(text, sizeMm) {
  let path = qrCache.get(text), n;
  if (!path) {
    const q = qrcodeMatrix(text, 'M'); n = q.size; let d = '';
    for (let r = 0; r < n; r++) for (let c = 0; c < n; c++) if (q.isDark(r, c)) d += `M${c + 2} ${r + 2}h1v1h-1z`;
    path = { d, n }; qrCache.set(text, path);
  }
  const v = path.n + 4;
  return `<svg class="qr" viewBox="0 0 ${v} ${v}" width="${sizeMm}mm" height="${sizeMm}mm" shape-rendering="crispEdges" aria-hidden="true"><rect width="${v}" height="${v}" fill="#fff"/><path d="${path.d}" fill="#000"/></svg>`;
}

function labelHTML(p, L) {
  const pad = 2.2 * 2;
  const qrMm = L.vertical ? L.w - 10 : Math.min(L.h - pad + 1.2, L.w * 0.45);
  const dims = p.dims ? p.dims + ' cm' : '';
  const text = `<div class="ltext">
    <div class="lcode" style="font-size:${L.code}mm">${esc(p.code)}</div>
    <div class="lname" style="font-size:${L.name}mm">${esc(p.name)}</div>
    ${L.meta ? `<div class="lmeta" style="font-size:${L.meta}mm">${esc([dims, p.piece].filter(Boolean).join(' · '))}</div>` : ''}
    ${L.brand ? `<div class="lbrand" style="font-size:${L.brand}mm">Total Team</div>` : ''}
  </div>`;
  const style = L.vertical ? 'flex-direction:column;justify-content:center;text-align:center;gap:4mm' : '';
  return `<div class="label" style="width:${L.w}mm;height:${L.h}mm;${style}">${qrSvg(QR_BASE + p.code, qrMm)}${text}</div>`;
}

function selected() {
  const cat = $('cat').value, q = $('q').value.trim().toLowerCase();
  const codes = $('codes').value.split(/[\s,;]+/).map(s => s.trim().toUpperCase()).filter(Boolean);
  let list = PRODUCTS;
  if (codes.length) {
    const set = new Set(codes);
    list = list.filter(p => set.has(p.code.toUpperCase()));
  } else {
    if (cat !== 'Minden') list = list.filter(p => p.category === cat);
    if (q) list = list.filter(p => q.split(/\s+/).every(w => (p.name + ' ' + p.code + ' ' + p.category + ' ' + (p.tags || []).join(' ')).toLowerCase().includes(w)));
  }
  if (!$('perPiece').checked) return list;
  const out = [];
  list.forEach(p => { const n = Math.max(1, p.qty || 1); for (let i = 1; i <= n; i++) out.push(n > 1 ? { ...p, piece: `${i}/${n}` } : p); });
  return out;
}

function render() {
  const key = $('layout').value, L = LAYOUTS[key];
  const perSheet = L.cols * L.rows, isSheet = perSheet > 1;
  $('skipWrap').hidden = !isSheet;
  const skip = isSheet ? Math.min(perSheet - 1, Math.max(0, (parseInt($('skip').value, 10) || 1) - 1)) : 0;
  $('pageStyle').textContent = `@page { size: ${L.page[0]}mm ${L.page[1]}mm; margin: 0; }`;
  const items = [...Array(skip).fill(null), ...selected()];
  const sheets = [];
  for (let i = 0; i < items.length; i += perSheet) sheets.push(items.slice(i, i + perSheet));
  $('preview').innerHTML = sheets.map(s => `<div class="sheet" style="width:${L.page[0]}mm;height:${L.page[1]}mm;padding:${L.top}mm 0 0 ${L.left}mm;grid-template-columns:repeat(${L.cols}, ${L.w}mm);grid-auto-rows:${L.h}mm">${
    s.map(p => p ? labelHTML(p, L) : `<div class="label blank" style="width:${L.w}mm;height:${L.h}mm"></div>`).join('')}</div>`).join('')
    || '<p class="info">Nincs a szűrésnek megfelelő tétel.</p>';
  const n = items.length - skip;
  $('info').textContent = `${n} címke · ${sheets.length} ${isSheet ? 'ív' : 'oldal'}`;
  try { localStorage.setItem('tt_labels', JSON.stringify({ layout: key, perPiece: $('perPiece').checked })); } catch (e) {}
}

async function init() {
  const html = await (await fetch('/raktar.html', { cache: 'no-store' })).text();
  const m = html.match(/const PRODUCTS = (\[.*?\]);\s*\n/s);
  if (!m) { $('preview').innerHTML = '<p class="info">Nem sikerült beolvasni a terméklistát.</p>'; return; }
  PRODUCTS = JSON.parse(m[1]);
  const cats = ['Minden', ...[...new Set(PRODUCTS.map(p => p.category))].sort((a, b) => a.localeCompare(b, 'hu'))];
  $('cat').innerHTML = cats.map(c => `<option>${esc(c)}</option>`).join('');
  const params = new URLSearchParams(location.search);
  try { const s = JSON.parse(localStorage.getItem('tt_labels') || '{}'); if (s.layout && LAYOUTS[s.layout]) $('layout').value = s.layout; $('perPiece').checked = !!s.perPiece; } catch (e) {}
  if (params.get('layout') && LAYOUTS[params.get('layout')]) $('layout').value = params.get('layout');
  if (params.get('codes')) $('codes').value = params.get('codes');
  if (params.get('cat') && cats.includes(params.get('cat'))) $('cat').value = params.get('cat');
  render();
}
let t; const later = () => { clearTimeout(t); t = setTimeout(render, 200); };
['layout', 'cat', 'perPiece'].forEach(id => $(id).addEventListener('change', render));
['q', 'codes', 'skip'].forEach(id => $(id).addEventListener('input', later));
$('print').onclick = () => window.print();
init();
</script>
</body>
</html>

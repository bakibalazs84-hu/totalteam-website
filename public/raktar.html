<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Total Team kellékraktár – bútorok, lámpák, dekorációk bérlése film- és reklámforgatásokhoz.">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Total Team Raktár</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Inter:wght@400;500;600&display=swap">
<style>
/* Layout: sticky kereső fejléc · bal oldali kategória/szűrő sáv · képrács lapozással · termékadatlap modal */
:root {
  --bg: #f6f6f3; --surface: #ffffff; --border: #e3e2dc; --fg: #1b1a17; --fg-muted: #7d7b73;
  --accent: #a8823f; --accent-bg: #f7f0e3; --pill-bg: #edece7; --pill-active: #1b1a17; --pill-active-fg: #ffffff;
  --overlay: rgba(20,19,16,.6); --shadow: 0 1px 6px rgba(0,0,0,.08); --shadow-lg: 0 8px 32px rgba(0,0,0,.14);
  --ok: #2e7d32; --ok-bg: #e7f3e8; --bad: #c62828; --bad-bg: #fbe9e9; --on-accent: #ffffff;
  --radius: 6px;
  --font-display: 'Playfair Display', Georgia, serif;
  --font-body: 'Inter', system-ui, -apple-system, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #141412; --surface: #1d1c1a; --border: #2f2e2a; --fg: #f0efea; --fg-muted: #94928a;
    --accent: #cfa968; --accent-bg: #2a2418; --pill-bg: #292824; --pill-active: #f0efea; --pill-active-fg: #141412;
    --overlay: rgba(0,0,0,.72); --shadow: 0 1px 6px rgba(0,0,0,.3); --shadow-lg: 0 8px 32px rgba(0,0,0,.5);
    --ok: #81c784; --ok-bg: #1d2e1e; --bad: #ef9a9a; --bad-bg: #3a1f1f; --on-accent: #141412;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #141412; --surface: #1d1c1a; --border: #2f2e2a; --fg: #f0efea; --fg-muted: #94928a;
  --accent: #cfa968; --accent-bg: #2a2418; --pill-bg: #292824; --pill-active: #f0efea; --pill-active-fg: #141412;
  --overlay: rgba(0,0,0,.72); --shadow: 0 1px 6px rgba(0,0,0,.3); --shadow-lg: 0 8px 32px rgba(0,0,0,.5);
  --ok: #81c784; --ok-bg: #1d2e1e; --bad: #ef9a9a; --bad-bg: #3a1f1f; --on-accent: #141412;
  color-scheme: dark;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: var(--bg); color: var(--fg); font-family: var(--font-body); font-size: 14px; line-height: 1.5; }
button { font-family: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.header { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 100; background: var(--surface); border-bottom: 1px solid var(--border); }
.header-inner { display: flex; align-items: center; gap: 16px; min-height: 56px; max-width: 1400px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 8px; flex-wrap: wrap; }
.logo { font-family: var(--font-display); font-size: 19px; font-weight: 700; white-space: nowrap; }
.logo span { color: var(--accent); }
.search-wrap { flex: 1 1 220px; max-width: 480px; position: relative; }
.search-wrap svg { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); color: var(--fg-muted); pointer-events: none; }
#search { width: 100%; padding: 8px 12px 8px 34px; border: 1px solid var(--border); border-radius: var(--radius); background: var(--bg); color: var(--fg); font: 13px var(--font-body); outline: none; }
#search:focus { border-color: var(--accent); }
.header-right { display: flex; align-items: center; gap: 8px; margin-left: auto; }
.view-btns { display: flex; border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; }
.view-btn { background: none; border: none; cursor: pointer; padding: 6px 10px; color: var(--fg-muted); display: flex; align-items: center; }
.view-btn svg { fill: currentColor; }
.view-btn.list svg { fill: none; stroke: currentColor; }
.view-btn.active, .view-btn:hover { background: var(--pill-active); color: var(--pill-active-fg); }
.results-count { font-size: 12px; color: var(--fg-muted); white-space: nowrap; font-variant-numeric: tabular-nums; }

.layout { display: flex; max-width: 1400px; margin: 0 auto; gap: 24px; padding-block: 20px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.layout { align-items: flex-start; }
.sidebar { width: 230px; flex-shrink: 0; position: sticky; top: calc(var(--hdr, 64px) + 16px); max-height: calc(100vh - var(--hdr, 64px) - 32px); overflow-y: auto; overscroll-behavior: contain; padding-right: 6px; scrollbar-width: thin; }
.sidebar-section { margin-bottom: 20px; }
.sidebar-title { font-size: 10px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--fg-muted); margin-bottom: 8px; padding-bottom: 6px; border-bottom: 1px solid var(--border); }
.cat-list { list-style: none; }
.cat-item { display: flex; align-items: center; gap: 8px; padding: 5px 8px; border-radius: var(--radius); cursor: pointer; font-size: 13px; user-select: none; }
.cat-item:hover { background: var(--pill-bg); }
.cat-item.sub { padding-left: 22px; font-size: 12.5px; }
.cat-item.active { background: var(--accent-bg); color: var(--accent); font-weight: 600; }
.cat-count { margin-left: auto; font-size: 11px; color: var(--fg-muted); font-variant-numeric: tabular-nums; }
.filter-group-header { display: flex; align-items: center; justify-content: space-between; width: 100%; padding: 6px 8px; border-radius: var(--radius); cursor: pointer; font-size: 13px; color: var(--fg); background: none; border: none; text-align: left; }
.filter-group-header:hover { background: var(--pill-bg); }
.filter-group-arrow { width: 14px; height: 14px; color: var(--fg-muted); transition: transform .2s; }
.filter-group.open .filter-group-arrow { transform: rotate(90deg); }
.filter-group-body { display: none; padding: 4px 0 8px 4px; }
.filter-group.open .filter-group-body { display: block; }
.chip-list { display: flex; flex-wrap: wrap; gap: 4px; }
.chip { padding: 3px 10px; border-radius: 20px; border: 1px solid var(--border); background: none; font-size: 11px; color: var(--fg-muted); cursor: pointer; white-space: nowrap; }
.chip:hover { border-color: var(--accent); color: var(--accent); }
.chip.active { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.reset-btn { margin-top: 8px; background: none; border: none; color: var(--accent); font-size: 12px; cursor: pointer; padding: 4px 8px; }
.filter-toggle { display: none; align-items: center; gap: 6px; padding: 7px 14px; border: 1px solid var(--border); border-radius: 20px; background: var(--surface); color: var(--fg); font-size: 13px; cursor: pointer; }

.main { flex: 1; min-width: 0; }
.grid { display: grid; gap: 12px; }
.grid.cols-2 { grid-template-columns: repeat(2, minmax(0,1fr)); }
.grid.cols-3 { grid-template-columns: repeat(3, minmax(0,1fr)); }
.grid.cols-4 { grid-template-columns: repeat(4, minmax(0,1fr)); }
.grid.list-view { grid-template-columns: minmax(0,1fr); }
.card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; cursor: pointer; transition: box-shadow .15s, transform .1s; display: flex; flex-direction: column; text-align: left; color: inherit; font: inherit; padding: 0; }
.card:hover { box-shadow: var(--shadow); transform: translateY(-1px); }
.card-img { aspect-ratio: 4/3; max-width: 100%; background: var(--bg); display: flex; align-items: center; justify-content: center; overflow: hidden; position: relative; }
.card-img img { width: 100%; height: 100%; object-fit: cover; }
.card-img.fit img { object-fit: contain; padding: 6px; }
.ph { display: flex; flex-direction: column; align-items: center; gap: 4px; color: var(--fg-muted); font-size: 11px; text-align: center; padding: 8px; }
.ph svg { opacity: .45; }
.badge { position: absolute; top: 6px; left: 6px; font-size: 9px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; padding: 2px 7px; border-radius: 3px; }
.badge.szabad { background: var(--ok-bg); color: var(--ok); }
.badge.foglalt { background: var(--bad-bg); color: var(--bad); }
.nimg { position: absolute; bottom: 6px; right: 6px; font-size: 10px; padding: 1px 6px; border-radius: 3px; background: var(--overlay); color: #fff; font-variant-numeric: tabular-nums; }
.card-body { padding: 10px 12px 12px; display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.card-name { font-weight: 600; font-size: 13px; text-wrap: balance; overflow-wrap: anywhere; }
.card-code { font-size: 11px; color: var(--fg-muted); font-variant-numeric: tabular-nums; }
.card-meta { display: flex; justify-content: space-between; gap: 6px; font-size: 11px; color: var(--fg-muted); margin-top: 2px; }
.card-meta strong { color: var(--fg); }
.list-view .card { flex-direction: row; }
.list-view .card-img { width: 110px; aspect-ratio: 4/3; flex-shrink: 0; }
.list-view .card-body { flex: 1; justify-content: center; }
.more-wrap { display: flex; justify-content: center; padding: 20px 0 8px; }
.more-btn { padding: 9px 22px; border-radius: 20px; border: 1px solid var(--border); background: var(--surface); color: var(--fg); cursor: pointer; font-size: 13px; }
.more-btn:hover { border-color: var(--accent); color: var(--accent); }
.empty { grid-column: 1 / -1; padding: 60px 20px; text-align: center; color: var(--fg-muted); }

.modal-overlay { position: fixed; inset: 0; background: var(--overlay); z-index: 200; display: flex; align-items: center; justify-content: center;
  padding: max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(16px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
.modal { background: var(--surface); border-radius: 12px; max-width: 780px; width: 100%; max-height: 92vh; overflow-y: auto; position: relative; box-shadow: var(--shadow-lg); }
.modal-close { position: absolute; top: 12px; right: 12px; background: var(--overlay); border: none; color: #fff; border-radius: 50%; width: 32px; height: 32px; cursor: pointer; font-size: 16px; z-index: 2; }
.modal-gallery { padding: 16px 20px 0; }
.modal-main { width: 100%; max-width: 100%; aspect-ratio: 4/3; background: var(--bg); border-radius: 8px; overflow: hidden; display: flex; align-items: center; justify-content: center; margin-bottom: 10px; }
.modal-main img { width: 100%; height: 100%; object-fit: contain; }
.thumbs { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 2px; }
.thumb { width: 72px; height: 54px; flex-shrink: 0; border-radius: 5px; overflow: hidden; border: 2px solid transparent; cursor: pointer; background: var(--bg); padding: 0; }
.thumb.active { border-color: var(--accent); }
.thumb img { width: 100%; height: 100%; object-fit: cover; }
.modal-body { padding: 16px 20px 24px; display: flex; flex-direction: column; gap: 16px; }
.modal-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
.modal-title { font-family: var(--font-display); font-size: 22px; font-weight: 700; text-wrap: balance; overflow-wrap: anywhere; }
.fav-btn { background: none; border: 1px solid var(--border); border-radius: 50%; width: 38px; height: 38px; cursor: pointer; display: flex; align-items: center; justify-content: center; flex-shrink: 0; color: var(--fg-muted); }
.fav-btn.active { border-color: var(--bad); color: var(--bad); background: var(--bad-bg); }
.fav-btn.active svg { fill: currentColor; }
.info-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 10px; background: var(--bg); border-radius: 8px; padding: 14px; }
.info-item label { font-size: 10px; text-transform: uppercase; letter-spacing: .07em; color: var(--fg-muted); display: block; margin-bottom: 2px; }
.info-item span { font-size: 14px; font-weight: 600; font-variant-numeric: tabular-nums; }
.pill { display: inline-block; padding: 2px 10px; border-radius: 20px; font-size: 12px; font-weight: 700; }
.pill.szabad { background: var(--ok-bg); color: var(--ok); }
.pill.foglalt { background: var(--bad-bg); color: var(--bad); }
.sec-title { font-size: 10px; font-weight: 700; letter-spacing: .09em; text-transform: uppercase; color: var(--fg-muted); margin-bottom: 8px; padding-bottom: 4px; border-bottom: 1px solid var(--border); }
.tags { display: flex; flex-wrap: wrap; gap: 6px; }
.tag { padding: 4px 12px; border-radius: 20px; border: 1px solid var(--border); font-size: 12px; color: var(--fg-muted); background: var(--pill-bg); }
.action-row { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.qty { display: flex; border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; }
.qty button { background: var(--bg); border: none; cursor: pointer; width: 34px; height: 38px; font-size: 18px; color: var(--fg); }
.qty output { width: 40px; display: flex; align-items: center; justify-content: center; font-weight: 600; border-inline: 1px solid var(--border); font-variant-numeric: tabular-nums; }
.rent-btn { flex: 1 1 200px; height: 38px; background: var(--accent); color: var(--on-accent); border: none; border-radius: var(--radius); font-size: 14px; font-weight: 600; cursor: pointer; }
.rent-btn:disabled { background: var(--pill-bg); color: var(--fg-muted); cursor: not-allowed; }
.rent-note { font-size: 12px; color: var(--fg-muted); }
.rent-note code { user-select: all; background: var(--pill-bg); padding: 1px 5px; border-radius: 3px; }

@media (max-width: 760px) {
  .sidebar { display: none; }
  .sidebar.open { display: block; position: fixed; inset: 0; top: calc(env(safe-area-inset-top, 0px) + 104px); z-index: 90; width: auto; background: var(--surface); overflow-y: auto; max-height: none;
    padding: 16px max(16px, env(safe-area-inset-right, 0px)) calc(16px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
  .filter-toggle { display: flex; }
  .grid.cols-3, .grid.cols-4 { grid-template-columns: repeat(2, minmax(0,1fr)); }
  .modal-title { font-size: 18px; }
  .info-grid { grid-template-columns: repeat(2, minmax(0,1fr)); }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

</head>
<body>
<header class="header">
  <div class="header-inner">
    <div class="logo">Total Team<span>.</span> Raktár</div>
    <div class="search-wrap">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
      <input id="search" type="search" placeholder="Keresés: név, kód, szín, anyag…" autocomplete="off">
    </div>
    <div class="header-right">
      <button class="filter-toggle" id="filterToggle" type="button">Szűrők</button>
      <span class="results-count" id="resultsCount"></span>
      <div class="view-btns">
        <button class="view-btn" data-cols="2" title="2 oszlop" type="button"><svg width="14" height="14" viewBox="0 0 16 16"><rect x="1" y="1" width="6" height="6" rx="1"/><rect x="9" y="1" width="6" height="6" rx="1"/><rect x="1" y="9" width="6" height="6" rx="1"/><rect x="9" y="9" width="6" height="6" rx="1"/></svg></button>
        <button class="view-btn" data-cols="3" title="3 oszlop" type="button"><svg width="14" height="14" viewBox="0 0 18 18"><rect x="1" y="1" width="4" height="4" rx="1"/><rect x="7" y="1" width="4" height="4" rx="1"/><rect x="13" y="1" width="4" height="4" rx="1"/><rect x="1" y="7" width="4" height="4" rx="1"/><rect x="7" y="7" width="4" height="4" rx="1"/><rect x="13" y="7" width="4" height="4" rx="1"/><rect x="1" y="13" width="4" height="4" rx="1"/><rect x="7" y="13" width="4" height="4" rx="1"/><rect x="13" y="13" width="4" height="4" rx="1"/></svg></button>
        <button class="view-btn" data-cols="4" title="4 oszlop" type="button"><svg width="14" height="14" viewBox="0 0 20 20"><rect x="1" y="1" width="3" height="3"/><rect x="6" y="1" width="3" height="3"/><rect x="11" y="1" width="3" height="3"/><rect x="16" y="1" width="3" height="3"/><rect x="1" y="6" width="3" height="3"/><rect x="6" y="6" width="3" height="3"/><rect x="11" y="6" width="3" height="3"/><rect x="16" y="6" width="3" height="3"/><rect x="1" y="11" width="3" height="3"/><rect x="6" y="11" width="3" height="3"/><rect x="11" y="11" width="3" height="3"/><rect x="16" y="11" width="3" height="3"/></svg></button>
        <button class="view-btn list" data-cols="list" title="Lista" type="button"><svg width="14" height="14" viewBox="0 0 24 24" stroke-width="2"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg></button>
      </div>
    </div>
  </div>
</header>

<div class="layout">
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-section">
      <div class="sidebar-title">Kategória</div>
      <ul class="cat-list" id="catList"></ul>
    </div>
    <div class="sidebar-section">
      <div class="sidebar-title">Szűrők</div>
      <div id="filterGroups"></div>
      <button class="reset-btn" id="resetFilters" type="button">Szűrők törlése</button>
    </div>
  </aside>
  <main class="main">
    <div class="grid cols-3" id="grid"></div>
    <div class="more-wrap" id="moreWrap" hidden><button class="more-btn" id="moreBtn" type="button">Továbbiak betöltése</button></div>
  </main>
</div>

<div class="modal-overlay" id="modal" hidden role="dialog" aria-modal="true" aria-labelledby="mTitle">
  <div class="modal" id="modalBox">
    <button class="modal-close" id="modalClose" aria-label="Bezárás" type="button">✕</button>
    <div class="modal-gallery">
      <div class="modal-main" id="mMain"></div>
      <div class="thumbs" id="mThumbs"></div>
    </div>
    <div class="modal-body">
      <div class="modal-head">
        <h2 class="modal-title" id="mTitle"></h2>
        <button class="fav-btn" id="mFav" title="Kedvencekhez" type="button"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg></button>
      </div>
      <div class="info-grid">
        <div class="info-item"><label>Azonosító</label><span id="mCode"></span></div>
        <div class="info-item"><label>Kategória</label><span id="mCat"></span></div>
        <div class="info-item"><label>Méret (cm)</label><span id="mDims"></span></div>
        <div class="info-item"><label>Darabszám</label><span id="mQty"></span></div>
        <div class="info-item"><label>Készlet</label><span id="mStatus"></span></div>
        <div class="info-item"><label>Képek</label><span id="mImgs"></span></div>
      </div>
      <div id="mTagsWrap"><div class="sec-title">Jellemzők</div><div class="tags" id="mTags"></div></div>
      <div class="action-row">
        <div class="qty"><button id="qMinus" type="button" aria-label="Kevesebb">−</button><output id="qNum">1</output><button id="qPlus" type="button" aria-label="Több">+</button></div>
        <button class="rent-btn" id="rentBtn" type="button">Bérlési igény küldése</button>
      </div>
      <p class="rent-note">Ha nem nyílik meg a levelező: <code>info@totalteam.hu</code></p>
    </div>
  </div>
</div>

<script>

  img.replaceWith(ph);
}
const imgTag = (u, size, alt, lazy) => `<img src="${esc(webUrl(u, size))}" data-orig="${esc(u)}" alt="${esc(alt)}"${lazy ? ' loading="lazy" decoding="async"' : ''} onerror="imgFail(this)">`;

const FILTERS = [
  { key: 'meret', label: 'Méret (leghosszabb oldal)', opts: ['max. 60 cm', '60–120 cm', '120–200 cm', '200+ cm'] },
  { key: 'darab', label: 'Darabszám', opts: ['1 db', '2–5 db', '6+ db'] },
  { key: 'szin', label: 'Szín', opts: ['fehér','fekete','szürke','barna','arany','réz','króm','zöld','kék','bordó','lila','sárga','világos'] },
  { key: 'anyag', label: 'Anyag', opts: ['fa','fém','bőr','műbőr','bársony','üveg','márvány','rattan','műanyag','textil'] },
  { key: 'stilus', label: 'Stílus', opts: ['modern','retró','klasszikus','antik','art deco','mid-century','skandináv'] },
  { key: 'foglalat', label: 'Foglalat (lámpák)', opts: ['E27','E14','G9'] },
  { key: 'keszlet', label: 'Készlet', opts: ['szabad','foglalt'] },
];
const PAGE = 48;
// Ezekben a kategóriákban a kártyakép nincs levágva: az egész termék látszik
const FIT_CATS = ['Faládák'];
let state = { cat: 'Minden', sub: null, cols: 3, list: false, q: '', f: {}, shown: PAGE };
let favs = new Set();
try { favs = new Set(JSON.parse(localStorage.getItem('tt_favs') || '[]')); } catch (e) {}
try { const s = JSON.parse(localStorage.getItem('tt_view') || '{}'); if (s.cols) state.cols = s.cols; if (s.list) state.list = true; } catch (e) {}

const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const ICON = '<svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="m21 15-5-5L5 21"/></svg>';
const maxDim = p => { const n = (p.dims.match(/\d+/g) || []).map(Number); return n.length ? Math.max(...n) : null; };

function match(p) {
  if (state.cat === '♥ Kedvencek') { if (!favs.has(p.id)) return false; }
  else if (state.cat !== 'Minden' && p.category !== state.cat) return false;
  if (state.sub && p.sub !== state.sub) return false;
  const q = state.q.trim().toLowerCase();
  if (q && !(p.name + ' ' + p.code + ' ' + p.category + ' ' + p.tags.join(' ')).toLowerCase().includes(q)) return false;
  const f = state.f;
  if (f.darab) { const d = p.qty; if ((f.darab === '1 db' && d !== 1) || (f.darab === '2–5 db' && (d < 2 || d > 5)) || (f.darab === '6+ db' && d < 6)) return false; }
  if (f.keszlet && p.status !== f.keszlet) return false;
  for (const k of ['szin', 'anyag', 'stilus', 'foglalat']) if (f[k] && !p.tags.includes(f[k])) return false;
  if (f.meret) {
    const m = maxDim(p); if (m === null) return false;
    if ((f.meret === 'max. 60 cm' && m > 60) || (f.meret === '60–120 cm' && (m < 60 || m > 120)) || (f.meret === '120–200 cm' && (m < 120 || m > 200)) || (f.meret === '200+ cm' && m <= 200)) return false;
  }
  return true;
}

function renderSidebar() {
  const counts = {}, subs = {};
  PRODUCTS.forEach(p => {
    counts[p.category] = (counts[p.category] || 0) + 1;
    if (p.sub) { subs[p.category] = subs[p.category] || {}; subs[p.category][p.sub] = (subs[p.category][p.sub] || 0) + 1; }
  });
  const items = [['Minden', PRODUCTS.length], ...Object.entries(counts).sort((a, b) => a[0].localeCompare(b[0], 'hu'))];
  if (favs.size) items.splice(1, 0, ['♥ Kedvencek', favs.size]);
  document.getElementById('catList').innerHTML = items.map(([c, n]) => {
    let html = `<li class="cat-item ${state.cat === c && !state.sub ? 'active' : ''}" data-cat="${esc(c)}" tabindex="0">${esc(c)}<span class="cat-count">${n}</span></li>`;
    const sc = subs[c] ? Object.entries(subs[c]).sort((a, b) => b[1] - a[1]) : [];
    if (state.cat === c && sc.length > 1) html += sc.map(([s, m]) =>
      `<li class="cat-item sub ${state.sub === s ? 'active' : ''}" data-cat="${esc(c)}" data-sub="${esc(s)}" tabindex="0">${esc(s)}<span class="cat-count">${m}</span></li>`).join('');
    return html;
  }).join('');
}
document.getElementById('catList').addEventListener('click', e => {
  const li = e.target.closest('.cat-item'); if (!li) return;
  state.cat = li.dataset.cat; state.sub = li.dataset.sub || null; state.shown = PAGE;
  document.getElementById('sidebar').classList.remove('open'); render(); window.scrollTo(0, 0);
});

function renderFilters() {
  document.getElementById('filterGroups').innerHTML = FILTERS.map(g => `
    <div class="filter-group ${state.f[g.key] ? 'open' : ''}" data-g="${g.key}">
      <button class="filter-group-header" type="button">${g.label}<svg class="filter-group-arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="9 18 15 12 9 6"/></svg></button>
      <div class="filter-group-body"><div class="chip-list">${g.opts.map(o => `<button type="button" class="chip ${state.f[g.key] === o ? 'active' : ''}" data-k="${g.key}" data-v="${esc(o)}">${esc(o)}</button>`).join('')}</div></div>
    </div>`).join('');
}
document.getElementById('filterGroups').addEventListener('click', e => {
  const chip = e.target.closest('.chip');
  if (chip) {
    const k = chip.dataset.k, v = chip.dataset.v;
    state.f[k] = state.f[k] === v ? null : v; state.shown = PAGE;
    document.querySelectorAll(`.chip[data-k="${k}"]`).forEach(c => c.classList.toggle('active', state.f[k] === c.dataset.v));
    render(); return;
  }
  const h = e.target.closest('.filter-group-header');
  if (h) h.parentElement.classList.toggle('open');
});
document.getElementById('resetFilters').addEventListener('click', () => { state.f = {}; state.shown = PAGE; renderFilters(); render(); });

function imgHTML(p, size) {
  const src = showable(p)[0];
  if (src) return imgTag(src, size, p.name, true);
  return `<div class="ph">${ICON}Nincs fotó</div>`;
}

function cardHTML(p) {
  const n = p.imgs.length;
  return `<button class="card" data-id="${p.id}" type="button">
    <div class="card-img${FIT_CATS.includes(p.category) ? ' fit' : ''}">${imgHTML(p, 'thumb')}<span class="badge ${p.status}">${p.status === 'foglalt' ? 'Foglalt' : 'Szabad'}</span>${n > 1 ? `<span class="nimg">${n} kép</span>` : ''}</div>
    <div class="card-body">
      <div class="card-name">${esc(p.name)}</div>
      <div class="card-code">${p.code}${state.list ? ' · ' + esc(p.category) : ''}</div>
      <div class="card-meta"><span>${p.dims ? esc(p.dims) + ' cm' : '&nbsp;'}</span><span>Db: <strong>${p.qty}</strong></span></div>
    </div></button>`;
}

function render() {
  const list = PRODUCTS.filter(match);
  const grid = document.getElementById('grid');
  grid.className = 'grid ' + (state.list ? 'list-view' : 'cols-' + state.cols);
  document.querySelectorAll('.view-btn').forEach(b => b.classList.toggle('active', state.list ? b.dataset.cols === 'list' : b.dataset.cols == state.cols));
  document.getElementById('resultsCount').textContent = `${list.length} termék`;
  grid.innerHTML = list.length ? list.slice(0, state.shown).map(cardHTML).join('') : '<div class="empty">Nincs találat ezekkel a szűrőkkel.</div>';
  const mw = document.getElementById('moreWrap');
  mw.hidden = list.length <= state.shown;
  document.getElementById('moreBtn').textContent = `Továbbiak betöltése (még ${Math.max(0, list.length - state.shown)})`;
  renderSidebar();
}
document.getElementById('grid').addEventListener('click', e => { const c = e.target.closest('.card'); if (c) openModal(c.dataset.id); });
document.getElementById('moreBtn').addEventListener('click', () => { state.shown += PAGE; render(); });

// ── Modal
let cur = null, qty = 1;
function openModal(id) {
  const p = PRODUCTS.find(x => x.id === id); if (!p) return;
  cur = p; qty = 1; document.getElementById('qNum').textContent = 1;
  const imgs = showable(p);
  const main = document.getElementById('mMain');
  const setMain = i => { main.innerHTML = imgTag(imgs[i], 'large', p.name, false); };
  if (imgs.length) setMain(0); else main.innerHTML = imgHTML(p, 'large');
  const th = document.getElementById('mThumbs');
  th.innerHTML = imgs.length > 1 ? imgs.map((u, i) => `<button type="button" class="thumb ${i ? '' : 'active'}" data-i="${i}">${imgTag(u, 'thumb', '', true)}</button>`).join('') : '';
  th.onclick = e => { const t = e.target.closest('.thumb'); if (!t) return; setMain(+t.dataset.i); th.querySelectorAll('.thumb').forEach(x => x.classList.toggle('active', x === t)); };
  document.getElementById('mTitle').textContent = p.name;
  document.getElementById('mCode').textContent = p.code;
  document.getElementById('mCat').textContent = p.sub ? `${p.category} / ${p.sub}` : p.category;
  document.getElementById('mDims').textContent = p.dims || '—';
  document.getElementById('mQty').textContent = p.qty + ' db';
  document.getElementById('mImgs').textContent = p.imgs.length + ' db';
  document.getElementById('mStatus').innerHTML = `<span class="pill ${p.status}">${p.status === 'foglalt' ? 'Foglalt' : 'Szabad'}</span>`;
  const tags = p.tags.filter(t => t !== p.sub);
  document.getElementById('mTagsWrap').hidden = !tags.length;
  document.getElementById('mTags').innerHTML = tags.map(t => `<span class="tag">${esc(t)}</span>`).join('');
  const btn = document.getElementById('rentBtn');
  btn.disabled = p.status === 'foglalt'; btn.textContent = btn.disabled ? 'Jelenleg foglalt' : 'Bérlési igény küldése';
  document.getElementById('mFav').classList.toggle('active', favs.has(p.id));
  document.getElementById('modal').hidden = false;
  document.getElementById('modalBox').scrollTop = 0;
}
const closeModal = () => { document.getElementById('modal').hidden = true; };
document.getElementById('modalClose').onclick = closeModal;
document.getElementById('modal').addEventListener('click', e => { if (e.target.id === 'modal') closeModal(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });
document.getElementById('qMinus').onclick = () => { if (qty > 1) document.getElementById('qNum').textContent = --qty; };
document.getElementById('qPlus').onclick = () => { if (cur && qty < cur.qty) document.getElementById('qNum').textContent = ++qty; };
document.getElementById('rentBtn').onclick = () => {
  if (!cur) return;
  const body = `Bérlési igény: ${cur.name} (${cur.code}), ${qty} db`;
  location.href = `mailto:info@totalteam.hu?subject=${encodeURIComponent('Bérlési igény – ' + cur.name)}&body=${encodeURIComponent(body)}`;
};
document.getElementById('mFav').onclick = () => {
  if (!cur) return;
  favs.has(cur.id) ? favs.delete(cur.id) : favs.add(cur.id);
  try { localStorage.setItem('tt_favs', JSON.stringify([...favs])); } catch (e) {}
  document.getElementById('mFav').classList.toggle('active', favs.has(cur.id));
  renderSidebar();
};

document.querySelectorAll('.view-btn').forEach(b => b.addEventListener('click', () => {
  state.list = b.dataset.cols === 'list'; if (!state.list) state.cols = +b.dataset.cols;
  try { localStorage.setItem('tt_view', JSON.stringify({ cols: state.cols, list: state.list })); } catch (e) {}
  render();
}));
let qt; document.getElementById('search').addEventListener('input', e => { clearTimeout(qt); qt = setTimeout(() => { state.q = e.target.value; state.shown = PAGE; render(); }, 150); });
document.getElementById('filterToggle').onclick = () => document.getElementById('sidebar').classList.toggle('open');

const _hdr = () => document.documentElement.style.setProperty('--hdr', document.querySelector('.header').offsetHeight + 'px');
_hdr(); window.addEventListener('resize', _hdr);
renderFilters();
render();
</script>
